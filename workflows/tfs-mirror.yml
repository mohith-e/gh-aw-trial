name: TFS Mirror Sync

# COMPANION of the tfs-* agentic workflows. This is plain
# GitHub Actions YAML — `gh aw add` does not distribute it, so copy this file
# into your consumer repo's .github/workflows/ as-is (no compile step). The
# canonical copy lives at RealPage/agentic-workflows/workflows/tfs-mirror.yml;
# check it for updates when you bump the implementer version.
#
# Pulls every branch from the on-prem TFS repo (configured via vars.TFS_BASE /
# vars.TFS_REPO) into GitHub under the `tfs-mirror/<branch>` prefix. GitHub's
# own `main` is left alone so the `.github/workflows/*` agent files (which only
# live on GitHub) are preserved.
#
# Why prefixed: GitHub is a read-only workspace and TFS is the source of truth,
# but `.github/workflows` exists only on GitHub. A flat 1:1 mirror would clobber
# those workflow files on every sync. The two lineages (GitHub `main` and
# `tfs-mirror/*`) share no history and are never merged in either direction —
# TFS -> GitHub is the only flow, and it is a one-way force overwrite, so the
# mirrored commit SHAs are always byte-identical to TFS and cannot diverge.
#
# Consumed by: tfs-implement and tfs-review-pr, whose clone sites start from
# refs/heads/tfs-mirror/<target-branch> and fetch only the delta from TFS
# whenever that ref exists. Both degrade gracefully if this workflow stalls —
# their TFS fetch closes any gap, and the implementer emits a ::warning when
# the mirror lags — but each run then pays a growing transfer, so keep this
# workflow healthy. A repo that does not install this file is not broken:
# both workflows clone straight from TFS instead.
#
# RECOMMENDED: protect the mirror namespace with a repository ruleset on
# `refs/heads/tfs-mirror/**` that blocks pushes, branch creation, and PRs for
# everyone except this workflow's identity (or repo admins). Humans committing
# to mirror refs is the only way the mirror can diverge from TFS — the next
# sync force-converges it back, but the ruleset prevents the confusion
# entirely.
#
# LARGE REPOS: a branch's first-ever mirror push has no existing tfs-mirror/*
# ref to diff against, so it transfers that branch's *entire* history in one
# shot. On a repo with a deep/large history this can exceed GitHub's push
# size or timeout limits and fail with an opaque `RPC failed; HTTP 500`. Set
# the optional variable TFS_MIRROR_BOOTSTRAP_BRANCH to your long-running
# branch (e.g. `master`, `main`, `develop`) to have that one branch seeded via
# a chunked, resumable push before the normal loop runs. Because git objects
# are shared across branches, seeding one long-running branch this way makes
# every other branch's first sync cheap too (they mostly diff against the
# same shared history). Leave unset for repos small enough that a plain push
# already works — this is a no-op when unset.
#
# The bootstrap resumes across runs: if a run is interrupted (job timeout,
# cancellation, or a non-size push failure), it leaves the mirror ref at the
# last pushed chunk and the next run continues from there rather than
# re-pushing from the start. A single bootstrap can run up to the job's
# 120-min timeout; since scheduled runs use `cancel-in-progress: false`, later
# runs queue behind a long bootstrap instead of cancelling it — expect a short
# backlog of pending runs to drain once the bootstrap completes.

on:
  schedule:
    # Off-the-hour minutes (3,13,23,33,43,53). GitHub Actions throttles
    # scheduled workflows that fire on common boundaries like :00, :10, :15.
    # Staggered against tfs-implement's 7,22,37,52 so the
    # implementer usually runs a few minutes after a fresh sync.
    - cron: "3,13,23,33,43,53 * * * *"
  workflow_dispatch:

concurrency:
  group: tfs-mirror
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    env:
      # Set on both the bootstrap step and the main push loop, so hoisted here.
      BOOTSTRAP_BRANCH: ${{ vars.TFS_MIRROR_BOOTSTRAP_BRANCH }}
      # Error signatures that mean a push failed because the transfer exceeded
      # GitHub's push size/timeout budget, as opposed to a transient network or
      # permission blip. Shared by the chunked bootstrap step (to decide when to
      # halve the chunk vs. plain-retry) and the main push loop (to decide when
      # to point at the bootstrap feature) so the two stay in lockstep.
      PUSH_SIZE_ERR_RE: "RPC failed|HTTP 5[0-9]{2}|unexpected disconnect"
    # Steady-state syncs take well under a minute (checkout of existing mirror
    # refs + delta fetch from TFS). The generous timeout is for the BOOTSTRAP
    # run on a huge repo: the initial `git fetch tfs` transfers the repo's
    # full history from the on-prem server, and — if TFS_MIRROR_BOOTSTRAP_BRANCH
    # is set — the chunked push below can take a while longer since it trades
    # push size for many small round trips rather than one large transfer.
    timeout-minutes: 120
    steps:
      - name: Verify required secrets and variables
        # First-run safety net. Without this, missing config silently resolves
        # to empty strings and the job fails later with a confusing git error.
        env:
          TFS_PAT_SET: ${{ secrets.TFS_PAT != '' }}
          TFS_BASE_VAR: ${{ vars.TFS_BASE }}
          TFS_REPO_VAR: ${{ vars.TFS_REPO }}
        run: |
          set -euo pipefail
          missing=()
          [ "$TFS_PAT_SET" = "true" ] || missing+=("secret TFS_PAT")
          [ -n "$TFS_BASE_VAR" ]      || missing+=("variable TFS_BASE")
          [ -n "$TFS_REPO_VAR" ]      || missing+=("variable TFS_REPO")
          if [ ${#missing[@]} -eq 0 ]; then
            echo "All required secrets and variables are present."
            exit 0
          fi
          echo "::error::Workflow not configured. Missing required values:"
          for v in "${missing[@]}"; do echo "::error::  - $v"; done
          cat <<'EOF'

          ─────────────────────────────────────────────────────────────────
          How to configure TFS Mirror Sync
          ─────────────────────────────────────────────────────────────────
          Open the repo on GitHub → Settings → Secrets and variables → Actions.

          Add the missing Secrets (tab: Secrets):
            TFS_PAT      Azure DevOps PAT with Code: Read scope on the target
                         TFS project. (The tfs-implement workflow already
                         requires Read & Write — the same secret works.)

          Add the missing Variables (tab: Variables):
            TFS_BASE     Project base URL, URL-encoded.
                         e.g. https://tfs.example.com/tfs/Org/Project%20Name
            TFS_REPO     TFS git repo name.
                         e.g. loft-core

          Optional Variables:
            TFS_MIRROR_BOOTSTRAP_BRANCH   Name of a long-running branch (e.g.
                         master/main/develop) to seed via chunked push on a
                         large repo's first sync. See the LARGE REPOS note
                         near the top of this file. Leave unset otherwise.
          ─────────────────────────────────────────────────────────────────
          EOF
          exit 1

      - name: Checkout GitHub repo
        # fetch-depth: 0 pulls ALL branches including the existing tfs-mirror/*
        # refs — that is what makes the TFS fetch below incremental: the local
        # repo already holds the bulk of TFS history (from GitHub, well-peered
        # to the runner), so `git fetch tfs` transfers only new objects.
        #
        # SHA-pinned (not a mutable tag): this workflow holds TFS_PAT and
        # `contents: write`, so it matches the supply-chain posture of the
        # compiled gh-aw lock files, which pin the same SHA.
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git identity
        run: |
          git config user.name "tfs-mirror-bot"
          git config user.email "tfs-mirror-bot@users.noreply.github.com"

      - name: Add TFS remote and fetch all branches
        env:
          TFS_PAT: ${{ secrets.TFS_PAT }}
          TFS_BASE: ${{ vars.TFS_BASE }}
          TFS_REPO: ${{ vars.TFS_REPO }}
        run: |
          set -euo pipefail
          # Pass PAT as Basic auth via http.extraheader, never embed in URL.
          # `${TFS_PAT}` is a GitHub Actions secret — it's automatically masked in logs.
          tfs_url="${TFS_BASE}/_git/${TFS_REPO}"
          tfs_host="${TFS_BASE#*://}"; tfs_host="${tfs_host%%/*}"
          b64_auth=$(printf ':%s' "$TFS_PAT" | base64 -w0)
          if git remote | grep -qx tfs; then
            git remote set-url tfs "$tfs_url"
          else
            git remote add tfs "$tfs_url"
          fi
          # Configure auth header for tfs remote URL pattern.
          git config --local "http.https://${tfs_host}/.extraheader" "Authorization: Basic $b64_auth"
          git fetch tfs '+refs/heads/*:refs/remotes/tfs/*' --prune

      - name: Bootstrap large branch via chunked push (optional)
        run: |
          set -euo pipefail
          # No-op unless TFS_MIRROR_BOOTSTRAP_BRANCH is set — see the
          # LARGE REPOS note at the top of this file.
          if [ -z "${BOOTSTRAP_BRANCH:-}" ]; then
            echo "TFS_MIRROR_BOOTSTRAP_BRANCH not set — skipping chunked bootstrap."
            exit 0
          fi
          if ! git show-ref --verify --quiet "refs/remotes/tfs/${BOOTSTRAP_BRANCH}"; then
            echo "::warning::TFS_MIRROR_BOOTSTRAP_BRANCH='${BOOTSTRAP_BRANCH}' does not match any branch fetched from TFS — skipping chunked bootstrap."
            exit 0
          fi

          tfs_tip="$(git rev-parse "refs/remotes/tfs/${BOOTSTRAP_BRANCH}")"
          mirror_sha="$(git ls-remote origin "refs/heads/tfs-mirror/${BOOTSTRAP_BRANCH}" 2>/dev/null | awk 'NR==1{print $1}')"
          # Treat bootstrap as done ONLY when the mirror ref already sits exactly
          # at the TFS tip. Mere existence is not enough: a prior run may have
          # created the ref but stopped short of the tip (job timeout,
          # cancellation, or a non-size failure), and skipping on existence alone
          # would leave the normal push loop to attempt the huge remaining
          # delta in one shot — the very failure this feature exists to prevent.
          if [ -n "$mirror_sha" ] && [ "$mirror_sha" = "$tfs_tip" ]; then
            echo "refs/heads/tfs-mirror/${BOOTSTRAP_BRANCH} already at the TFS tip — bootstrap complete, skipping."
            exit 0
          fi

          # First-ever push of this branch: walk its history oldest -> newest
          # and push forward in batches instead of transferring the whole
          # thing in one shot. Each individual push only needs to fit inside
          # GitHub's per-push size/timeout budget, not the whole branch.
          # Object storage is shared across branches, so this doesn't just
          # bootstrap BOOTSTRAP_BRANCH — every other branch built on the same
          # lineage becomes a cheap incremental push once this is done.
          #
          # Resume: if the mirror ref exists and is an ancestor of the TFS tip,
          # push only the commits after it. If it has diverged from this lineage
          # (e.g. a TFS-side history rewrite) or isn't present locally, fall back
          # to the whole history — the force-push converges either way.
          range="refs/remotes/tfs/${BOOTSTRAP_BRANCH}"
          resumed=false
          if [ -n "$mirror_sha" ] && git merge-base --is-ancestor "$mirror_sha" "$tfs_tip" 2>/dev/null; then
            range="${mirror_sha}..refs/remotes/tfs/${BOOTSTRAP_BRANCH}"
            resumed=true
          fi
          mapfile -t commits < <(git rev-list --reverse "$range")
          total=${#commits[@]}
          if [ "$resumed" = true ]; then
            echo "Resuming bootstrap of refs/heads/tfs-mirror/${BOOTSTRAP_BRANCH}: mirror at ${mirror_sha}, ${total} commits remaining to the TFS tip."
          else
            echo "Bootstrapping refs/heads/tfs-mirror/${BOOTSTRAP_BRANCH} via chunked push (${total} commits)..."
          fi

          chunk=500
          i=0
          transient=0
          while [ "$i" -lt "$total" ]; do
            next=$(( i + chunk ))
            [ "$next" -gt "$total" ] && next=$total
            sha="${commits[$(( next - 1 ))]}"
            if git push origin "+${sha}:refs/heads/tfs-mirror/${BOOTSTRAP_BRANCH}" 2>chunk_push_err.log; then
              echo "  pushed ${next}/${total} commits (through ${sha})"
              i=$next
              transient=0
            elif grep -qE "$PUSH_SIZE_ERR_RE" chunk_push_err.log; then
              # Size/timeout-shaped failure — exactly what chunking is for. Halve.
              cat chunk_push_err.log
              if [ "$chunk" -le 1 ]; then
                echo "::error::Chunked bootstrap of '${BOOTSTRAP_BRANCH}' failed even at chunk size 1 (commit ${sha}). A single commit likely exceeds GitHub's push size/timeout limits on its own (e.g. a huge file in that commit) — this needs manual investigation, not a smaller chunk."
                exit 1
              fi
              prev=$chunk
              chunk=$(( chunk / 2 ))
              [ "$chunk" -lt 1 ] && chunk=1
              transient=0
              echo "  push failed at chunk size ${prev} (size/timeout-shaped) — retrying from commit $((i + 1)) with chunk size ${chunk}"
            else
              # Not size-shaped: a transient network/permission blip. Retry the
              # SAME chunk a few times before giving up, rather than shrinking
              # the chunk and eventually misreporting it as a huge-commit problem.
              cat chunk_push_err.log
              transient=$(( transient + 1 ))
              if [ "$transient" -gt 3 ]; then
                echo "::error::Chunked bootstrap of '${BOOTSTRAP_BRANCH}' failed ${transient} times at commit ${sha} with a non-size-related error (see log above) — this looks like a transient network/permission problem, not a push-size limit. The next scheduled run resumes from the last pushed chunk; investigate connectivity/credentials if it keeps recurring."
                exit 1
              fi
              echo "  push failed with a non-size-related error (attempt ${transient}/3) — retrying the same chunk (size ${chunk})"
            fi
          done
          echo "Bootstrap complete: refs/heads/tfs-mirror/${BOOTSTRAP_BRANCH} now matches the TFS tip."

      - name: Push TFS branches to GitHub under tfs-mirror/*
        run: |
          set -euo pipefail
          # Push every TFS branch to GitHub as `tfs-mirror/<branch>`. The `+`
          # (force) makes TFS authoritative: any divergence on the GitHub side
          # — including a TFS-side history rewrite — converges back to exactly
          # the TFS state on the next sync. The push transfers the same
          # immutable objects fetched from TFS, so commit SHAs on GitHub are
          # byte-identical to TFS.
          while IFS= read -r ref; do
            [ -z "$ref" ] && continue
            branch="${ref#refs/remotes/tfs/}"
            [ "$branch" = "HEAD" ] && continue
            echo "Mirroring tfs/$branch -> origin/tfs-mirror/$branch"
            if ! git push origin "+${ref}:refs/heads/tfs-mirror/${branch}" 2>push_err.log; then
              cat push_err.log
              if [ -z "${BOOTSTRAP_BRANCH:-}" ] && grep -qE "$PUSH_SIZE_ERR_RE" push_err.log; then
                echo "::error::Push of '${branch}' failed in a way consistent with a large first-time history transfer exceeding GitHub's push size/timeout limits."
                echo "::error::If this repo has a large long-running branch (e.g. master/main/develop), set the repo variable TFS_MIRROR_BOOTSTRAP_BRANCH to that branch name to enable chunked bootstrap, then re-run this workflow."
              fi
              exit 1
            fi
          done < <(git for-each-ref --format='%(refname)' refs/remotes/tfs/)

      - name: Prune deleted TFS branches from GitHub mirror
        run: |
          set -euo pipefail
          # If a branch exists on GitHub under tfs-mirror/ but no longer exists on TFS, delete it.
          while IFS= read -r line; do
            [ -z "$line" ] && continue
            gh_ref="$(echo "$line" | awk '{print $2}')"
            branch="${gh_ref#refs/heads/tfs-mirror/}"
            if ! git show-ref --verify --quiet "refs/remotes/tfs/${branch}"; then
              echo "Deleting stale mirror branch: tfs-mirror/${branch}"
              # Non-fatal, but surfaced: a failure here usually means a
              # ruleset or permission blocks deletion for this identity.
              git push origin --delete "refs/heads/tfs-mirror/${branch}" \
                || echo "::warning title=Mirror prune failed::Could not delete refs/heads/tfs-mirror/${branch} — check that rulesets/permissions allow this workflow's identity to delete tfs-mirror/* branches."
            fi
          done < <(git ls-remote origin 'refs/heads/tfs-mirror/*' || true)
