# Hub-and-Spoke Agent Dispatch — the "hub" half.
#
# SPIKE (RealPage/ai-internal-enablement#1510). Not a supported entrypoint yet.
#
# A repo keeps its Actions secrets exactly where they are and adds a thin stub
# workflow that calls this one with `secrets: inherit`. Nothing is migrated,
# copied, or centrally stored — the caller's own already-declared secrets are
# forwarded into this run.
#
# ── Why this file names no secrets ───────────────────────────────────────────
# A step-level `env:` mapping cannot dereference a secret whose name is computed
# at runtime: `${{ secrets[inputs.x] }}` is resolved when the YAML is rendered,
# so every name would have to appear literally here. That is how a shared hub
# rots — each new consumer's secret names accumulate in the central file, and
# the thing that was meant to be maintained once becomes a registry of every
# repo that ever called it.
#
# The way out is to stop treating the secrets as YAML and treat them as data:
# `toJSON(secrets)` hands the callee the whole inherited set, and the CALLER
# names which of its own secrets to expose via the `secret_env` input. Names
# live in the stub, next to the repo that owns them. This file stays generic and
# never grows a consumer-specific line.
#
# ── Why this is a plain reusable workflow, not a gh-aw workflow ──────────────
#   - gh-aw's compiler owns the `on:` block in a .lock.yml, so a hand-added
#     `workflow_call` would be clobbered on the next recompile, and the shared
#     sources under `workflows/` are not reachable by `uses:` at all.
#   - gh-aw runs Claude Code in a credential-stripped agent container whose
#     health checks assert keys are ABSENT. An inherited secret lands in the job
#     environment, which is where a plain step runs — not inside that sandbox.
#     Credentialed work belongs here, in a plain step.
#
# A reusable workflow executes in the CALLER's context: `github.repository` is
# the caller, so a bare `actions/checkout` clones the caller's code.
#
# SECURITY: `boot_command` is executed as shell with the resolved secrets in
# scope. It MUST be hard-coded in the calling stub. A stub must never forward a
# `workflow_dispatch` input into it — that would be arbitrary code execution
# against the repo's own credentials.
name: Agent Runner (hub)

on:
  workflow_call:
    inputs:
      correlation_id:
        description: Opaque id echoed back so a caller can match this run to its request.
        required: true
        type: string
      secret_env:
        description: >-
          Comma-separated names of the CALLER's own inherited secrets to expose
          to boot_command as environment variables. Names only — values are
          never passed as inputs. A name the caller does not have resolves to
          absent and is reported as such rather than failing the run.
        required: false
        type: string
        default: ""
      boot_command:
        description: >-
          Hard-coded shell to run against the caller's checkout with the
          secret_env variables in scope. Empty skips the boot job.
          NEVER pass a dispatch input here.
        required: false
        type: string
        default: ""
      working_directory:
        description: Directory within the caller's checkout to run boot_command in.
        required: false
        type: string
        default: "."

permissions:
  contents: read

jobs:
  # Reports what the callee can actually see, for the names the caller asked
  # about. Presence and length only — never a value.
  probe:
    name: probe (${{ inputs.correlation_id }})
    runs-on: ubuntu-latest
    steps:
      - name: Report requested secrets — presence and length only
        env:
          # The whole inherited set, as data. Confined to this step: the boot
          # job re-reads it and narrows to secret_env before anything else runs.
          ALL_SECRETS: ${{ toJSON(secrets) }}
          SECRET_ENV: ${{ inputs.secret_env }}
        run: |
          set -euo pipefail
          {
            echo "### Requested secrets"
            echo
            if [ -z "$SECRET_ENV" ]; then
              echo "_None requested (\`secret_env\` empty)._"
            else
              echo "| name | resolved | length |"
              echo "|---|---|---|"
              printf '%s' "$SECRET_ENV" | tr ',' '\n' | while read -r name; do
                name="$(printf '%s' "$name" | tr -d '[:space:]')"
                [ -z "$name" ] && continue
                len=$(jq -r --arg n "$name" '(.[$n] // "") | length' <<<"$ALL_SECRETS")
                if [ "$len" -gt 0 ]; then
                  echo "| $name | yes | $len |"
                else
                  echo "| $name | no | 0 |"
                fi
              done
            fi
            echo
            echo "Total names in the inherited set: $(jq -r 'keys | length' <<<"$ALL_SECRETS")"
            echo
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Report vars resolution
        env:
          # `secrets: inherit` covers secrets only, so whether the `vars`
          # context reads the CALLER's org/repo variables is a separate
          # question. Reported by listing the names actually present rather
          # than checking a fixed list — a fixed list would put consumer
          # specifics back into this file, and var names are not secret.
          ALL_VARS: ${{ toJSON(vars) }}
        run: |
          set -euo pipefail
          {
            echo "### vars context (whose variables reach the callee?)"
            echo
            echo "Names visible: $(jq -r 'keys | length' <<<"$ALL_VARS")"
            echo
            jq -r 'keys[] | "- `\(.)`"' <<<"$ALL_VARS"
            echo
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Report caller context
        run: |
          {
            echo "### Caller context"
            echo
            echo "| field | value |"
            echo "|---|---|"
            echo "| correlation_id | \`${{ inputs.correlation_id }}\` |"
            echo "| github.repository | \`${{ github.repository }}\` |"
            echo "| github.ref | \`${{ github.ref }}\` |"
            echo "| github.sha | \`${{ github.sha }}\` |"
            echo "| github.workflow_ref | \`${{ github.workflow_ref }}\` |"
            echo "| github.event_name | \`${{ github.event_name }}\` |"
            echo "| github.triggering_actor | \`${{ github.triggering_actor }}\` |"
            echo "| boot_command set | ${{ inputs.boot_command != '' }} |"
            echo
          } >> "$GITHUB_STEP_SUMMARY"

  # The credentialed work. This is the half that has to succeed for the pattern
  # to be worth anything: presence of a secret is not proof that it is live.
  boot:
    name: boot (${{ inputs.correlation_id }})
    if: inputs.boot_command != ''
    runs-on: ubuntu-latest
    steps:
      # No `repository:` — a reusable workflow runs in the caller's context, so
      # this clones the CALLER's code at the ref that triggered the stub.
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      # Narrows the inherited set to exactly what the caller asked for and hands
      # those on via $GITHUB_ENV. ALL_SECRETS is scoped to this step alone, so
      # the step that runs caller-supplied shell never has the full set in its
      # environment. Each value is masked before it can reach a log.
      - name: Resolve requested secrets
        if: inputs.secret_env != ''
        env:
          ALL_SECRETS: ${{ toJSON(secrets) }}
          SECRET_ENV: ${{ inputs.secret_env }}
        run: |
          set -euo pipefail
          for name in $(printf '%s' "$SECRET_ENV" | tr ',' ' '); do
            [ -z "$name" ] && continue
            value=$(jq -r --arg n "$name" '.[$n] // empty' <<<"$ALL_SECRETS")
            if [ -z "$value" ]; then
              echo "::warning::$name not present in the inherited set; exporting empty"
            else
              echo "::add-mask::$value"
            fi
            # Delimiter form, so a multi-line value (an SSH key, say) survives.
            {
              echo "$name<<__GH_AW_EOF_${name}"
              printf '%s\n' "$value"
              echo "__GH_AW_EOF_${name}"
            } >> "$GITHUB_ENV"
          done

      - name: Run boot command
        working-directory: ${{ inputs.working_directory }}
        env:
          # Passed through env rather than interpolated into the script body, so
          # the command text can never be spliced into this step's shell source.
          BOOT_COMMAND: ${{ inputs.boot_command }}
        run: |
          set -euo pipefail
          echo "::group::boot_command"
          printf '%s\n' "$BOOT_COMMAND"
          echo "::endgroup::"
          bash -c "$BOOT_COMMAND"

      - name: Record outcome
        if: always()
        run: |
          {
            echo "### Boot (\`${{ inputs.correlation_id }}\`)"
            echo
            echo "Outcome: **${{ job.status }}**"
            echo
          } >> "$GITHUB_STEP_SUMMARY"
